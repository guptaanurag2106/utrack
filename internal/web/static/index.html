<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>utrack — Sway Activity Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="logo">
          <img src="/static/favicon.svg" alt="logo" width="26" height="26">
          <h1>utrack</h1>
          <span class="badge">Sway IPC</span>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="btn-icon" title="Toggle dark/light theme">🌙</button>
        </div>
      </div>

      <!-- Controls Toolbar (Intervals & Actions on single unified row below header) -->
      <div class="controls-toolbar">
        <div class="controls-left">
          <div class="btn-group">
            <button data-range="today" class="active">Today</button>
            <button data-range="yesterday">Yesterday</button>
            <button data-range="week">7 Days</button>
            <button data-range="all">All</button>
          </div>
          <div class="custom-range">
            <input type="date" id="date-from" autocomplete="off">
            <span>–</span>
            <input type="date" id="date-to" autocomplete="off">
            <button id="apply-custom-date">Filter</button>
          </div>
        </div>

        <div class="controls-right">
          <span id="date-display-badge" class="date-range-badge"></span>
          <button id="btn-refresh">↻ Refresh</button>
          <label class="checkbox-label">
            <input type="checkbox" id="auto-refresh-toggle"> Auto (10s)
          </label>
        </div>
      </div>
    </header>

    <!-- Top Summary Statistics Cards -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Active Time</div>
        <div class="stat-value" id="stat-total-time">—</div>
      </div>
      <div class="stat-card" id="card-daily-avg" style="display:none;" title="Total active time divided by calendar days in the selected range">
        <div class="stat-title">Daily Average</div>
        <div class="stat-value" id="stat-daily-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Applications Tracked</div>
        <div class="stat-value" id="stat-app-count">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Most Active App</div>
        <div class="stat-value" id="stat-top-app" style="font-size:18px; word-break:break-all;">—</div>
      </div>
    </section>

    <!-- Daily Breakdown (Visible when multiple days are selected) -->
    <div class="panel" id="daily-panel" style="display:none; margin-bottom: 24px;">
      <div class="panel-header">
        <span>Daily Screen Time (Hours)</span>
        <span id="daily-hover-info" class="hover-info">Click any bar to drill down into that day</span>
      </div>
      <div class="panel-body" style="padding: 16px;">
        <div style="width:100%; height:180px; position:relative;">
          <canvas id="daily-chart-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- Unified Applications with Collapsible Title Drilldowns -->
    <div class="panel">
      <div class="panel-header">
        <span>Tracked Applications</span>
        <span style="font-size:12px; font-weight:normal; color:var(--text-muted);">Click an app to expand/collapse window titles</span>
      </div>
      <div class="panel-body" id="app-list">
        <div class="empty-state">Loading activities...</div>
      </div>
    </div>

    <!-- Timeline Horizontal Visualizer -->
    <section class="timeline-section">
      <div class="timeline-bar-wrapper">
        <div style="font-weight:600; margin-bottom:12px; font-size:13px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;">
          <span>Session Activity Distribution</span>
          <span id="timeline-hover-info" class="hover-info"></span>
        </div>
        <div class="canvas-container">
          <canvas id="timeline-canvas"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
